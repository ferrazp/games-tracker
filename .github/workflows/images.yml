name: Images

# - push a main            -> :main y :sha-<7>
# - llamado desde Release  -> :X.Y.Z, :X.Y y :latest (desde el tag vX.Y.Z)
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Versión publicada por release-please (sin la v)
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ferrazp/games-tracker-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ !inputs.version }}
            type=sha,prefix=sha-,format=short,enable=${{ !inputs.version }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ !!inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ !!inputs.version }}
            type=raw,value=latest,enable=${{ !!inputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ inputs.version || format('main-{0}', github.sha) }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
