name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          load: true
          tags: gt-backend:ci
          cache-from: type=gha,scope=backend
      - name: Backend image loads all its modules
        # Importa la app sin arrancarla (NODE_ENV=test): falla si a la imagen le falta una dependencia.
        run: |
          docker run --rm -e NODE_ENV=test -e DB_TYPE=postgresql gt-backend:ci \
            node -e "await import('./server-unified.js'); console.log('imports OK')"
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          load: true
          tags: gt-frontend:ci
          cache-from: type=gha,scope=frontend
      - name: Frontend bundle uses relative API
        # Falla si no hay bundle (antes un glob vacío pasaba) o si apunta a localhost:4000.
        run: |
          docker run --rm --entrypoint sh gt-frontend:ci -c '
            set -e
            ls /usr/share/nginx/html/assets/*.js > /dev/null
            if grep -l "localhost:4000" /usr/share/nginx/html/assets/*.js; then
              echo "El bundle apunta a localhost:4000"; exit 1
            fi'
