# Base común de QA y Prod. No se usa sola: los scripts agregan
# compose.<ambiente>.yaml, el nombre de proyecto (gt-qa / gt-prod) y el .env.
#   npm run qa:up            npm run prod:deploy -- X.Y.Z
# Ver docs/OPERACION.md.
services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?falta DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/ferrazp/games-tracker-backend:${IMAGE_TAG:?falta IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_TYPE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?falta ADMIN_PASS}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/ferrazp/games-tracker-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONT_PORT:?falta FRONT_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
    name: ${DB_VOLUME:?falta DB_VOLUME}
